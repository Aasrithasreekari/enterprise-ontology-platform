# Developer entry point for `alembic revision --autogenerate -m "..."`.
# The database URL comes from OP_DATABASE_URL (see migrations/env.py); runtime upgrades use `ontology-platform init-db`.
[alembic]
script_location = src/ontology_platform/migrations

[loggers]
keys = root

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[handler_console]
class = logging.StreamHandler
args = (sys.stderr,)
formatter = generic

[formatter_generic]
format = %(levelname)s %(name)s %(message)s
