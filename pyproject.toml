[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ontology-platform"
version = "0.1.0"
description = "Enterprise Ontology Platform: connectors, knowledge graph, query engine and MCP server"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "pyjwt[crypto]>=2.8",
    "pyyaml>=6.0",
    "httpx>=0.27",
    "mcp>=2.3,<3",
    "prometheus-client>=0.20",
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.1"]
aws = ["boto3>=1.34"]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[project.scripts]
ontology-platform = "ontology_platform.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# Non-Python files that must ship in the wheel (web console assets, Alembic template).
ontology_platform = ["api/static/*", "migrations/script.py.mako"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = ["ignore::DeprecationWarning"]
