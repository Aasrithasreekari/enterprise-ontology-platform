    title: PayHub Architecture Overview
    url: https://northwind.atlassian.net/wiki/spaces/ENG/pages/1001
    space: ENG
    labels:
    - product-payhub
    - app-payments-platform
    body: 'PayHub is composed of the payments-platform and ledger applications.


      Requests enter through payment-gateway, which validates tokens with auth-service. payment-processor authorises payments, calls fraud-detector
      for risk scoring and posts journal entries to ledger-service.


      State is stored in payments-db and ledger-db (PostgreSQL on RDS).'
