    url: https://northwind.atlassian.net/wiki/spaces/ENG/pages/1002
    space: ENG
    labels:
    - app-payments-platform
    - svc-payment-processor
    body: 'On-call runbook for payment incidents.


      If payment-processor latency exceeds 2s, check fraud-detector health first.


      Failover of payments-db: promote the read replica in the secondary region and update the connection secret.


      Escalate to the ledger team if ledger-service rejects postings.'
